name: 'Prepare clojure env'
description: 'Prepare clojure enviroment for build'
runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        java-version-file: '.java-version'
        distribution: 'corretto'

    - name: Set timezone to Europe/Helsinki
      shell: bash
      run: |
        sudo timedatectl set-timezone Europe/Helsinki
        echo "Europe/Helsinki" | sudo tee /etc/timezone

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        lein: 2.11.2

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-m2-